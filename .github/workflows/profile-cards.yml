name: Update profile

on:
  schedule:
    - cron: "0 3 1 * *"
    # Birthday: April 6, 00:00 in Brazil
    - cron: "0 3 6 4 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update age
        run: |
          today=$(TZ=America/Sao_Paulo date +%Y%m%d)
          age=$(( (today - 19990406) / 10000 ))
          sed -i -E "s/i'm [0-9]+ years old/i'm ${age} years old/" README.md

      # Pinned to the v2.1.0 commit: this third-party action receives the STATS_TOKEN secret.
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=NicolasAlvesM&show_icons=true&locale=en&layout=donut&theme=dracula&icon_color=2FC18C&title_color=2FC18C&bg_color=1A1D21
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git commit -m "Update profile" || exit 0
          git push

      # GitHub disables scheduled workflows after 60 days without repository activity;
      # calling the enable endpoint keeps this one running.
      - name: Keep schedule enabled
        if: ${{ !cancelled() }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile-cards.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
